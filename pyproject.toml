[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-forecast"
version = "1.0.0"
description = "Institutional-grade time series forecasting engine — trend decomposition, Fourier seasonality, changepoint detection, Bayesian inference, and full compliance audit trails — by Anagatam Technologies"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Anagatam Technologies"}
]
keywords = [
    "time-series",
    "forecasting",
    "prophet",
    "trend-decomposition",
    "seasonality",
    "changepoint-detection",
    "bayesian-inference",
    "fourier-decomposition",
    "cross-validation",
    "quantitative-finance",
    "institutional-grade",
    "audit-trail",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "plotly>=5.18",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "yfinance>=0.2",
]
data = [
    "yfinance>=0.2",
]
holidays = [
    "holidays>=0.40",
]
all = [
    "yfinance>=0.2",
    "holidays>=0.40",
]

[project.urls]
Homepage = "https://github.com/Anagatam/Chronos"
Documentation = "https://chronos-forecast.readthedocs.io/en/latest/"
Repository = "https://github.com/Anagatam/Chronos"
Issues = "https://github.com/Anagatam/Chronos/issues"
PyPI = "https://pypi.org/project/chronos-forecast/"
Changelog = "https://github.com/Anagatam/Chronos/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["chronos*"]

[tool.setuptools.package-data]
chronos = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
collect_ignore_glob = ["*.html", "*.png", "*.svg"]
